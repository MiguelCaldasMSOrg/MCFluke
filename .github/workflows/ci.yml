name: Build and offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Build all languages and run offline checks
        run: python tools/build.py --configuration Release
